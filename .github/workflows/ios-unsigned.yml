name: Unsigned iOS build
on:
  workflow_dispatch:
  push:
    branches: ["codex/ios-rounded-ui"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run check
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build without signing
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(xcodebuild -list -json -workspace "$workspace" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("workspace").fetch("schemes").find { |s| !s.start_with?("Pods-") }')
          test -n "$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p artifacts/Payload
          cp -R "$app" artifacts/Payload/
          cd artifacts
          zip -qry family-ledger-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: family-ledger-unsigned
          path: artifacts/family-ledger-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
