name: Diagnose iOS startup
on:
  push:
    branches: ["codex/ios-startup-debug"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean
      - name: Build and launch Release in simulator
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(xcodebuild -list -json -workspace "$workspace" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("workspace").fetch("schemes").find { |s| !s.start_with?("Pods-") }')
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination "id=$device" -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
          app=$(find simulator-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          xcrun simctl install "$device" "$app"
          xcrun simctl spawn "$device" log stream --level debug --style compact --predicate 'process == "app"' > startup.log 2>&1 &
          logger=$!
          xcrun simctl launch --terminate-running-process "$device" com.dwigh.familyledger
          sleep 15
          xcrun simctl io "$device" screenshot startup.png
          kill "$logger" || true
          grep -Ei 'error|exception|fatal|ReferenceError|TypeError|Invariant|Unhandled' startup.log | tail -80 || true
          xcrun simctl spawn "$device" launchctl list | grep com.dwigh.familyledger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-startup-diagnostics
          path: |
            startup.log
            startup.png
            simulator-build.log
          retention-days: 7
